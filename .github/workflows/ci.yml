name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        # Existing main is not clean: 58 errors, 30 warnings (mostly react-hooks and any).
        continue-on-error: true

      - name: Typecheck
        run: pnpm typecheck
